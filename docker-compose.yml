services:
  loginserver:
    # Image only needs to provide JDK 21 + an sbt launcher; the project's sbt (1.12.14)
    # and Scala (2.13.18) versions come from build.properties/build.sbt and are fetched
    # by the launcher. (No published sbtscala tag bundles 1.12.14_2.13.18.)
    #
    # Matches the JDK the Dockerfile builds with, so local runs and released builds share a
    # collector. JDK 21 defaults to G1, which avoids the multi-second stop-the-world full
    # collections of JDK 8's ParallelGC that stall every connected client at once.
    image: sbtscala/scala-sbt:eclipse-temurin-jammy-21.0.2_13_1.10.4_2.13.15
    volumes:
      - .:/PSF-Loginserver:z
    working_dir: /PSF-Loginserver
    depends_on:
      - db
    ports:
      - 51000-51001:51000-51001/udp
      - 51002:51002/tcp
    command: sbt server/run
    environment:
      CONFIG_FORCE_database_host: db
      CONFIG_FORCE_bind: 0.0.0.0
  adminer:
    image: adminer
    ports:
      - 51010:8080
  db:
    image: postgres:${POSTGRES_VERSION:-18}
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: psforever
      POSTGRES_PASSWORD: psforever
      POSTGRES_DATABASE: psforever
